<body>
  <noscript>
    Você precisa ativar o JavaScript para visualizar este aplicativo.
    <div>
      <h1>OPIN (OBSERVATÓRIO DOS PROFESSORES INDÍGENAS do Estado de São Paulo)</h1>
      <div>
        <p>
          Este é um observatório que busca mapear as escolas indígenas do estado
          de São Paulo, destacando suas localizações, características educacionais,
          infraestrutura e outros aspectos relevantes para o entendimento da
          educação indígena no estado.
        </p>
        <br>
        <p>
          Entre os elementos mapeados, estão informações sobre os povos
          indígenas atendidos, línguas faladas, modalidades de ensino
          e outros aspectos importantes para a compreensão da educação
          indígena na região.
        </p>
        <br>
      </div>
    </div>
  </noscript>
