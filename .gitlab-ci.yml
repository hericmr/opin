stages:
  - test
  - build
  - docker

cache:
  paths:
    - node_modules/
  key:
    files:
      - package-lock.json

test:
  stage: test
  script:
    - npm ci
    - npm run test -- --passWithNoTests
    - npm run lint
  allow_failure: true

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 7 days
  only:
    - main

docker:
  stage: docker
  needs:
    - build
  variables:
    VITE_API_URL: $VITE_API_URL
    VITE_API_ANON_KEY: $VITE_API_ANON_KEY
    VITE_ADMIN_PASSWORD: $VITE_ADMIN_PASSWORD
  script:
    # Garante que web_anon existe no banco com SELECT em todas as tabelas
    - docker exec opin_db_prod psql -U postgres -d opin_prod -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'web_anon') THEN CREATE ROLE web_anon NOLOGIN; END IF; END \$\$; GRANT USAGE ON SCHEMA public TO web_anon; GRANT SELECT ON ALL TABLES IN SCHEMA public TO web_anon;"
    - docker compose -f docker-compose.prod.yml build front
    - docker compose -f docker-compose.prod.yml up -d --no-deps front
    - docker compose -f docker-compose.prod.yml up -d --no-deps api
  only:
    - main

