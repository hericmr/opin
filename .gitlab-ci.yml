stages:
  - test
  - docker

cache:
  paths:
    - node_modules/
  key:
    files:
      - package-lock.json

test:
  stage: test
  script:
    - npm ci
    - npm run test -- --passWithNoTests
    - npm run lint
  allow_failure: true

docker:
  stage: docker
  # NÃO declare `image` aqui: este job roda em um runner com executor "shell"
  # (gitlab-runner instalado no próprio servidor de produção), executando
  # `docker compose` direto no host onde o Docker já está instalado.
  #
  # Não há stage `build` separado: o `vite build` de produção acontece DENTRO
  # do Dockerfile (FROM node:20-alpine), via `docker compose build front`.
  # Buildar no host seria redundante (o container refaz o build) e exigiria
  # Node 20+ no servidor — que hoje tem Node 18.
  # Só roda no runner marcado como "production" (registrado no servidor real,
  # matera.unifesp.br). Sem essa tag, o job pode cair em qualquer runner
  # disponível do projeto — inclusive um de desenvolvimento — e redeployar
  # os containers _prod no lugar errado.
  tags:
    - production
  variables:
    VITE_API_URL: $VITE_API_URL
    VITE_API_ANON_KEY: $VITE_API_ANON_KEY
    VITE_ADMIN_PASSWORD: $VITE_ADMIN_PASSWORD
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    JWT_SECRET: $JWT_SECRET
  script:
    # Verificar que as variáveis obrigatórias estão definidas antes de buildar
    # ou redeployar db/api — sem isso, docker-compose.prod.yml sobe api/db com
    # PGPASSWORD vazio e derruba a produção em silêncio.
    - |
      for var in VITE_API_ANON_KEY POSTGRES_PASSWORD JWT_SECRET VITE_ADMIN_PASSWORD; do
        val="$(eval echo \$$var)"
        if [ -z "$val" ]; then
          echo "ERRO: $var está vazia. Acesse Settings > CI/CD > Variables."
          exit 1
        fi
        if [ "$val" = "\$$var" ]; then
          echo "ERRO: $var não foi resolvida (ficou como literal '$val'). Adicione-a em Settings > CI/CD > Variables."
          exit 1
        fi
      done
    - echo "Variáveis obrigatórias definidas (VITE_API_ANON_KEY=${#VITE_API_ANON_KEY} chars, POSTGRES_PASSWORD=${#POSTGRES_PASSWORD} chars, JWT_SECRET=${#JWT_SECRET} chars)"
    # --no-cache garante que o npm run build rode com as variáveis atuais (sem reutilizar layer antigo)
    - docker compose -f docker-compose.prod.yml build --no-cache front
    - docker compose -f docker-compose.prod.yml up -d --no-deps front
    - docker compose -f docker-compose.prod.yml up -d --no-deps api
  only:
    - main

