stages:
  - test
  - build
  - docker

cache:
  paths:
    - node_modules/
  key:
    files:
      - package-lock.json

test:
  stage: test
  script:
    - npm ci
    - npm run test -- --passWithNoTests
    - npm run lint
  allow_failure: true

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 7 days
  only:
    - main

docker:
  stage: docker
  needs:
    - build
  variables:
    VITE_API_URL: $VITE_API_URL
    VITE_API_ANON_KEY: $VITE_API_ANON_KEY
    VITE_ADMIN_PASSWORD: $VITE_ADMIN_PASSWORD
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    JWT_SECRET: $JWT_SECRET
  script:
    # Verificar que as variáveis obrigatórias estão definidas antes de buildar
    # ou redeployar db/api — sem isso, docker-compose.prod.yml sobe api/db com
    # PGPASSWORD vazio e derruba a produção em silêncio.
    - |
      for var in VITE_API_ANON_KEY POSTGRES_PASSWORD JWT_SECRET; do
        if [ -z "$(eval echo \$$var)" ]; then
          echo "ERRO: $var não está definida no CI/CD. Acesse Settings > CI/CD > Variables."
          exit 1
        fi
      done
    - echo "Variáveis obrigatórias definidas (VITE_API_ANON_KEY=${#VITE_API_ANON_KEY} chars, POSTGRES_PASSWORD=${#POSTGRES_PASSWORD} chars, JWT_SECRET=${#JWT_SECRET} chars)"
    # Garante que o banco está rodando (sobe se necessário, aguarda ficar pronto)
    - docker compose -f docker-compose.prod.yml up -d db
    - timeout 60 bash -c 'until docker exec opin_db_prod pg_isready -U postgres; do sleep 2; done'
    # Garante que web_anon existe no banco com SELECT em todas as tabelas
    - docker exec opin_db_prod psql -U postgres -d opin_prod -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'web_anon') THEN CREATE ROLE web_anon NOLOGIN; END IF; END \$\$; GRANT USAGE ON SCHEMA public TO web_anon; GRANT SELECT ON ALL TABLES IN SCHEMA public TO web_anon;"
    # --no-cache garante que o npm run build rode com as variáveis atuais (sem reutilizar layer antigo)
    - docker compose -f docker-compose.prod.yml build --no-cache front
    - docker compose -f docker-compose.prod.yml up -d --no-deps front
    - docker compose -f docker-compose.prod.yml up -d --no-deps api
  only:
    - main

