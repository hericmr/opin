stages:
  - test
  - build
  - docker

cache:
  paths:
    - node_modules/
  key:
    files:
      - package-lock.json

test:
  stage: test
  script:
    - npm ci
    - npm run test -- --passWithNoTests
    - npm run lint
  allow_failure: true

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 7 days
  only:
    - main

docker:
  stage: docker
  needs:
    - build
  variables:
    VITE_API_URL: $VITE_API_URL
    VITE_API_ANON_KEY: $VITE_API_ANON_KEY
    VITE_ADMIN_PASSWORD: $VITE_ADMIN_PASSWORD
  script:
    - docker compose -f docker-compose.prod.yml build front
    - docker compose -f docker-compose.prod.yml up -d --no-deps front
  only:
    - main

