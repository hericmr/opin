services:
  api:
    image: postgrest/postgrest
    container_name: opin_api_prod
    restart: always
    ports:
      - "3000:3000" # Exposto apenas localmente, Nginx faz o proxy. Pode fechar se Nginx estiver na mesma rede (está).
      # Porem, frontend container fala com api via rede interna 'api'.
    environment:
      PGRST_DB_URI: "postgresql://"
      PGHOST: ${POSTGRES_HOST:-madri.unifesp.br}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-opin}
      PGUSER: ${POSTGRES_USER:-usu_opin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-usu_opin}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Precisa ser uma URI absoluta (esquema+host) — só afeta o campo "server" do
      # documento OpenAPI, não o roteamento real (isso é feito pelo nginx).
      PGRST_OPENAPI_SERVER_PROXY_URI: https://matera.unifesp.br/opin

  front:
    image: ${FRONT_IMAGE:-opin_front_prod_local}
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_ANON_KEY=${VITE_API_ANON_KEY}
        - VITE_ADMIN_PASSWORD=${VITE_ADMIN_PASSWORD}
    container_name: opin_front_prod
    restart: always
    ports:
      - "${PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./data/storage/opin:/usr/share/nginx/html/data/storage/opin:ro
      - ./config/nginx/sistemas.unifesp.br.crt:/etc/nginx/certs/sistemas.unifesp.br.crt
      - ./config/nginx/sistemas.unifesp.br.key:/etc/nginx/certs/sistemas.unifesp.br.key
    depends_on:
      - api

volumes:
  opin_db_prod_data:
    driver: local
