services:
  db:
    image: postgres:16
    container_name: opin_db
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/database/init_full.sql:/docker-entrypoint-initdb.d/init.sql
      - opin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: postgrest/postgrest
    container_name: opin_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: "postgresql://"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  storage:
    image: supabase/storage-api:v0.43.11
    container_name: opin_storage
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${VITE_API_ANON_KEY}
      SERVICE_KEY: ${STORAGE_SERVICE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Conexao com o banco via variaveis separadas (evita problemas com caracteres especiais na senha)
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@db:5432/${POSTGRES_DB}"
      DB_INSTALL_ROLES: "false"
      POSTGREST_URL: http://api:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_FILE_SIZE_LIMIT: "52428800"
      UPLOAD_FILE_SIZE_LIMIT: "52428800"
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: "52428800"
      TENANT_ID: opin
      REGION: local
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./data/storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  front:
    build:
      context: .
      args:
        - VITE_API_URL=
        - VITE_API_ANON_KEY=${VITE_API_ANON_KEY:-local-dev-key-ignore-auth}
    container_name: opin_front
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./data/storage/opin:/usr/share/nginx/html/data/storage/opin:ro
    depends_on:
      - api
      - storage


volumes:
  opin_db_data:
    driver: local
