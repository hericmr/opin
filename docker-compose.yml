services:
  db:
    image: postgres:16
    container_name: opin_db
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/database/init_full.sql:/docker-entrypoint-initdb.d/init.sql
      - opin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: postgrest/postgrest
    container_name: opin_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: "postgresql://"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-opin_user}
      # Leitura liberada; escrita só com JWT "admin": true de rpc/login (ver migration 20261021)
      PGRST_DB_PRE_REQUEST: privado.verificar_jwt
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Exposto ao SQL como app.settings.jwt_secret (usado por public.login)
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  storage:
    build:
      context: ./storage_server
    container_name: opin_storage
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      SERVER_PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./data/storage:/var/lib/storage

  front:
    build:
      context: .
      args:
        - VITE_API_URL=
        - VITE_API_ANON_KEY=${VITE_API_ANON_KEY:-local-dev-key-ignore-auth}
        - VITE_STORAGE_ENABLED=${VITE_STORAGE_ENABLED:-true}
    container_name: opin_front
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./data/storage/opin:/usr/share/nginx/html/data/storage/opin:ro
      - ./config/nginx/server.crt:/etc/nginx/certs/server.crt:ro
      - ./config/nginx/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - api
      - storage


volumes:
  opin_db_data:
    driver: local
