server {
    listen 80;
    server_name localhost;

    # Redirecionar da raiz para /opin/
    location = / {
        return 301 $scheme://$http_host/opin/;
    }

    location /opin/ {
        alias /usr/share/nginx/html/opin/;
        index index.html index.htm;
        try_files $uri $uri/ /opin/index.html;
    }

    # Servir arquivos do storage diretamente como estáticos
    location /opin/data/storage/opin/ {
        alias /usr/share/nginx/html/opin/data/storage/opin/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # CORS para o bucket
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy para a API PostgREST - compativel com padrao Supabase
    location /opin/rest/v1/ {
        rewrite ^/opin/rest/v1/(.*) /$1 break;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Remover header Authorization para evitar erro de JWT invalido no PostgREST anonimo
        proxy_set_header Authorization "";
    }

    # Proxy real para o Storage API
    location /opin/storage/v1/ {
        rewrite ^/opin/storage/v1/(.*)$ /storage/v1/$1 break;
        proxy_pass http://storage:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Necessario para upload de arquivos grandes
        client_max_body_size 50m;
        proxy_request_buffering off;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,prefer,x-upsert' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Proxy reverso para a API (opcional, se quiser servir tudo na mesma porta)
    # location /api/ {
    #     proxy_pass http://api:3000/;
    # }
}
