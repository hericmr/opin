server {
    listen 80;
    listen 443 ssl;
    server_name matera.unifesp.br;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/sistemas.unifesp.br.crt;
    ssl_certificate_key /etc/nginx/certs/sistemas.unifesp.br.key;
    ssl_protocols       SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reescreve /opin/* para /* internamente — suporte ao prefixo passado pelo servidor da universidade.
    # Sem essa regra, /opin/manifest.json e /opin/rest/v1/ não seriam encontrados.
    location /opin/ {
        rewrite ^/opin(/.*)$ $1 last;
    }

    # SPA routing — serve index.html para qualquer rota não encontrada
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos de storage servidos como estáticos
    location /data/storage/opin/ {
        alias /usr/share/nginx/html/data/storage/opin/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy para a API PostgREST
    location /rest/v1/ {
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }
}
