# Limite de tentativas de login do admin: 5/min por IP (rajada de 5)
limit_req_zone $binary_remote_addr zone=opin_login:10m rate=5r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name opin.unifesp.br;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reescreve /opin/* para /* internamente — suporte ao prefixo passado pelo servidor da universidade.
    # Sem essa regra, /opin/manifest.json e /opin/rest/v1/ não seriam encontrados.
    location /opin/ {
        rewrite ^/opin(/.*)$ $1 last;
    }

    # SPA routing — serve 200.html (index.html sem canonical, gerado no postbuild) para qualquer rota não encontrada
    location / {
        try_files $uri $uri/ /200.html;
    }

    # Arquivos de storage servidos como estáticos
    location /data/storage/opin/ {
        alias /usr/share/nginx/html/data/storage/opin/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Login do admin (função SQL public.login) com limite de tentativas
    location = /rest/v1/rpc/login {
        limit_req zone=opin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000/rpc/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para a API PostgREST
    location /rest/v1/ {
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }

    # Proxy para o Storage API
    location /storage/v1/ {
        rewrite ^/storage/v1/(.*)$ /storage/v1/$1 break;
        proxy_pass http://storage:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Necessário para upload de arquivos grandes
        client_max_body_size 50m;
        proxy_request_buffering off;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,prefer,x-upsert' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
