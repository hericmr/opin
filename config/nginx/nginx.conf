server {
    listen 80;
    listen 443 ssl;
    server_name opin.unifesp.br;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/sistemas.unifesp.br.crt;
    ssl_certificate_key /etc/nginx/certs/sistemas.unifesp.br.key;
    ssl_protocols       SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reescreve /opin/* para /* internamente — suporte ao prefixo passado pelo servidor da universidade.
    # Sem essa regra, /opin/manifest.json e /opin/rest/v1/ não seriam encontrados.
    location /opin/ {
        rewrite ^/opin(/.*)$ $1 last;
    }

    # SPA routing — serve index.html para qualquer rota não encontrada
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos de storage servidos como estáticos
    location /data/storage/opin/ {
        alias /usr/share/nginx/html/data/storage/opin/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy para a API PostgREST
    location /rest/v1/ {
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }

    # Proxy para o Storage API
    location /storage/v1/ {
        rewrite ^/storage/v1/(.*)$ /storage/v1/$1 break;
        proxy_pass http://storage:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Necessário para upload de arquivos grandes
        client_max_body_size 50m;
        proxy_request_buffering off;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,prefer,x-upsert' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
